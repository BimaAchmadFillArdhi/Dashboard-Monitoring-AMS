services:
  cctv-dashboard:
    build: .
    container_name: cctv-monitoring-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./cctv_monitoring.db:/app/cctv_monitoring.db
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
